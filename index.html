<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clockadashi</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1c">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <button id="fullscreenBtn" aria-label="Toggle fullscreen" title="Toggle fullscreen">
      <svg class="icon-expand" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg class="icon-compress is-hidden" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Clock is the only hero element; JS grows #clock to fill whatever
         space is left once the two bottom corners are accounted for. -->
    <main id="clockStage">
      <div id="clockGroup">
        <div id="clock" aria-live="off">
          <span id="clockMain">--:--</span><span id="clockSeconds">--</span><span id="clockAmPm"></span>
        </div>
        <div id="dateRow">&nbsp;</div>
      </div>
    </main>

    <!-- Bottom-left: today's events, then any upcoming Ekadashi progress bars -->
    <div id="cornerLeft">
      <div id="eventList"></div>
      <span id="loadingIndicator" class="spinner" hidden></span>
      <div id="progressList"></div>
    </div>

    <!-- Bottom-right: floating music player. Tap the card to reveal the full
         track list. Auto-hides after a couple of minutes of inactivity. -->
    <div id="player">
      <div id="downloadStatus" hidden></div>

      <div id="trackListPanel">
        <div id="trackList"></div>
      </div>

      <div id="playerCard" role="button" tabindex="0" aria-label="Show track list">
        <img id="trackArt" alt="" hidden>
        <div id="trackArtPlaceholder">&#9835;</div>
        <div id="trackInfo">
          <div id="trackTitle">Loading music&hellip;</div>
          <div id="trackAuthor"></div>
        </div>
        <button id="playBtn" aria-label="Play or pause">
          <svg class="icon-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="icon-pause is-hidden" viewBox="0 0 24 24" width="26" height="26"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <audio id="audioEl" preload="none"></audio>

  </div>

<script src="app.js"></script>
<script src="player.js"></script>
</body>
</html>
