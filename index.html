<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jellyclock</title>
<meta name="description" content="Wall clock with Ekadashi countdowns and offline devotional music">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/GoogleSansFlex-clockadashi.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=3.9.1">
<script defer src="app.js?v=3.9.1"></script>
<script defer src="player.js?v=3.9.1"></script>
<script defer src="intercom.js?v=3.9.1"></script>
<script defer src="timers.js?v=3.9.1"></script>
<script defer src="calendar.js?v=3.9.1"></script>
</head>
<body class="s-calm">
<noscript><div class="noscript">Javascript is not supported on this browser</div></noscript>

<!-- The clock screen: timers, calendar and music along the top, today's events, the
     clock, then the countdown bars across the full width. -->
<main id="screen">
  <header id="head">
    <div id="tools">
      <!-- Kitchen timers, top-left: "Timer" when idle; while running, the next one to
           finish in big digits with its progress ring, and a card with the two after it. -->
      <div id="timerDock">
        <button id="timerFab" type="button" aria-label="Kitchen timers">
          <span class="tf-head">
            <span id="tfIcon" class="tf-icon" data-icon="timer"></span>
            <svg id="tfRing" class="tf-ring" viewBox="0 0 40 40" aria-hidden="true" hidden>
              <circle class="tf-track" cx="20" cy="20" r="16"></circle>
              <circle id="tfArc" class="tf-arc" cx="20" cy="20" r="16"></circle>
            </svg>
            <span id="tfLabel" class="tf-label">Timer</span>
          </span>
          <span id="tfTime" class="tf-time num" hidden></span>
        </button>
        <button id="timerNext" type="button" aria-label="More timers" hidden></button>
      </div>
      <!-- The month, with Ekadashi and countdown days marked; a day can be previewed (date only, never the time). -->
      <button id="calBtn" class="ibtn" type="button" aria-label="Calendar" data-icon="calendar"></button>
      <button id="fsBtn" class="ibtn" type="button" aria-label="Full screen" data-icon="fullscreen"></button>
    </div>
    <div id="status" hidden><span id="statusIcon" hidden></span><span id="statusText"></span></div>
    <!-- Music, top-right. -->
    <div id="dock">
      <div id="mini">
        <button id="miniOpen" type="button" aria-label="Open music player">
          <span class="mini-art"><img id="miniArt" alt="" hidden><span id="miniPh" class="art-ph" data-icon="note"></span></span>
          <span class="mini-meta"><span id="miniTitle" class="mini-title">Music</span><span id="miniSub" class="mini-sub"></span></span>
        </button>
        <button id="miniPlay" class="ibtn" type="button" aria-label="Play" data-icon="play"></button>
        <button id="miniNext" class="ibtn" type="button" aria-label="Next song" data-icon="next"></button>
        <span class="mini-progress" aria-hidden="true"><i id="miniBar"></i></span>
      </div>
      <!-- Intercom: hold to record, let go to play it through the panel at full volume. -->
      <button id="miniTalk" class="ibtn" type="button" aria-label="Hold to talk" data-icon="mic"></button>
    </div>
  </header>

  <div id="top"></div>

  <div id="clockArea">
    <div id="clockBlock">
      <!-- HH:MM inside a glowing border that fills clockwise through the minute (the seconds). -->
      <div id="time">
        <svg id="minuteRing" aria-hidden="true">
          <path class="mr-track" pathLength="100"></path>
          <path class="mr-glow mr-glow-3" pathLength="100"></path>
          <path class="mr-glow mr-glow-2" pathLength="100"></path>
          <path class="mr-glow mr-glow-1" pathLength="100"></path>
          <path class="mr-line" pathLength="100"></path>
        </svg>
        <span id="hh">--</span>:<span id="mm">--</span>
      </div>
      <div id="date"></div>
    </div>
  </div>

  <div id="bars"></div>
</main>

<!-- Only while a date is previewed: a day back, a day forward. -->
<button id="dayPrev" class="day-arrow" type="button" aria-label="Previous day" data-icon="back" hidden></button>
<button id="dayNext" class="day-arrow" type="button" aria-label="Next day" data-icon="forward" hidden></button>

<!-- The month: slides up from the calendar button. -->
<section id="cs" aria-label="Calendar" aria-hidden="true">
  <header class="fp-head">
    <button id="csClose" class="ibtn" type="button" aria-label="Close calendar" data-icon="down"></button>
    <div class="cs-nav">
      <button id="csPrev" class="ibtn" type="button" aria-label="Previous month" data-icon="back"></button>
      <div class="cs-title"><div id="csMonth"></div><div id="csLunar"></div></div>
      <button id="csNext" class="ibtn" type="button" aria-label="Next month" data-icon="forward"></button>
    </div>
    <button id="csToday" class="cs-today" type="button">Today</button>
  </header>
  <div class="cs-body">
    <div class="cs-month">
      <div class="cs-week" aria-hidden="true"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div id="csGrid" class="cs-grid"></div>
    </div>
    <div class="cs-side">
      <div id="csList" class="cs-list"></div>
      <p id="csNote" class="cs-note"></p>
      <p class="cs-legend"><span class="cs-key cs-key-fruit" aria-hidden="true">🍌</span>Ekadashi
        <span class="cs-key cs-key-bar" aria-hidden="true"></span>countdown day
        <span class="cs-key cs-key-dot" aria-hidden="true"></span>other event</p>
    </div>
  </div>
</section>

<!-- Full player: slides up when the mini player is tapped. -->
<section id="fp" aria-label="Music player" aria-hidden="true">
  <div class="fp-tint"></div>
  <header class="fp-head">
    <button id="fpClose" class="ibtn" type="button" aria-label="Close music player" data-icon="down"></button>
    <div class="fp-headline"><span id="fpSwatch" class="fp-swatch" hidden></span><span id="fpHeadline"></span></div>
    <div id="fpTime" class="fp-time"></div>
  </header>
  <div class="fp-body">
    <div class="fp-main">
      <div id="fpArtBox" class="fp-art-box">
        <img id="fpArt" class="fp-art" alt="" hidden>
        <div id="fpArtPh" class="fp-art-ph" data-icon="note"></div>
      </div>
      <div class="fp-meta">
        <div id="fpTitle" class="fp-title"></div>
        <div id="fpSub" class="fp-sub"></div>
      </div>
      <div class="fp-seek">
        <input id="fpSeek" class="range" type="range" min="0" max="1000" step="1" value="0" aria-label="Song position">
        <div class="fp-times"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
      </div>
      <div class="fp-controls">
        <button id="fpShuffle" class="ibtn" type="button" aria-label="Shuffle" aria-pressed="false" data-icon="shuffle"></button>
        <button id="fpPrev" class="ibtn" type="button" aria-label="Previous song" data-icon="prev"></button>
        <button id="fpPlay" class="ibtn fp-play" type="button" aria-label="Play" data-icon="play"></button>
        <button id="fpNext" class="ibtn" type="button" aria-label="Next song" data-icon="next"></button>
        <button id="fpRepeat" class="ibtn" type="button" aria-label="Repeating all songs" data-icon="repeat"></button>
      </div>
      <div class="fp-vol">
        <span class="fp-vol-icon" data-icon="volDown"></span>
        <input id="fpVol" class="range" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        <span class="fp-vol-icon" data-icon="volUp"></span>
      </div>
    </div>
    <div class="fp-side">
      <div class="fp-tabs" role="tablist">
        <button id="tabQueue" class="fp-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="paneQueue">Up next</button>
        <button id="tabSearch" class="fp-tab" type="button" role="tab" aria-selected="false" aria-controls="paneSearch">Search</button>
        <span id="fpSaved"></span>
      </div>
      <div id="paneQueue" class="fp-pane" role="tabpanel" aria-labelledby="tabQueue">
        <div id="fpQueue" class="fp-queue"></div>
      </div>
      <div id="paneSearch" class="fp-pane" role="tabpanel" aria-labelledby="tabSearch" hidden>
        <form id="searchForm" class="search-bar" role="search" autocomplete="off">
          <span class="search-icon" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Search YouTube Music" enterkeyhint="search" aria-label="Search YouTube Music">
        </form>
        <div class="search-kinds" role="group" aria-label="Show">
          <button class="chip is-active" type="button" data-kind="songs" aria-pressed="true">Songs</button>
          <button class="chip" type="button" data-kind="videos" aria-pressed="false">Videos</button>
        </div>
        <div id="searchNote" class="search-note"></div>
        <div id="searchResults" class="fp-queue"></div>
      </div>
    </div>
  </div>
</section>

<!-- Kitchen timers: slides up from the timer button. -->
<section id="tp" aria-label="Kitchen timers" aria-hidden="true">
  <header class="fp-head">
    <button id="tpClose" class="ibtn" type="button" aria-label="Close timers" data-icon="down"></button>
    <div class="fp-headline">Kitchen timers</div>
    <div id="tpTime" class="fp-time"></div>
  </header>
  <div class="tp-body">
    <div class="tp-new">
      <div class="tp-stepper">
        <button id="tpLess" class="tp-step" type="button" aria-label="One minute less" data-icon="minus"></button>
        <div id="tpSet" class="tp-set num" aria-live="polite">20:00</div>
        <button id="tpMore" class="tp-step" type="button" aria-label="One minute more" data-icon="add"></button>
      </div>
      <button id="tpStart" class="tp-start" type="button">Start timer</button>
    </div>
    <div class="tp-side">
      <h2 class="tp-heading">Timers</h2>
      <div id="tpList" class="tp-list"></div>
      <p id="tpEmpty" class="tp-empty">No timers running. Pick a time and tap Start timer.</p>
    </div>
  </div>
</section>

<!-- Shown on top of everything when a timer finishes. -->
<section id="alarm" role="alertdialog" aria-labelledby="alarmTitle" aria-describedby="alarmSub" hidden>
  <div class="alarm-pulse" aria-hidden="true"></div>
  <div class="alarm-body">
    <span class="alarm-icon" data-icon="alarm"></span>
    <h2 id="alarmTitle"></h2>
    <p id="alarmSub"></p>
    <div class="alarm-actions">
      <button id="alarmAdd" type="button">+1 min</button>
      <button id="alarmStop" type="button">Stop</button>
    </div>
  </div>
</section>

<div id="diag" role="dialog" aria-label="Diagnostics" hidden>
  <div class="diag-head">
    <h2>Diagnostics</h2>
    <button id="diagClear" type="button">Clear activity</button>
    <button id="diagClose" type="button">Close</button>
  </div>
  <pre id="diagText"></pre>
</div>

<audio id="audio" preload="none"></audio>
</body>
</html>
