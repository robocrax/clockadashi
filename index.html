<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clockadashi</title>
<meta name="description" content="Wall clock with Ekadashi countdowns and offline devotional music">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=3.4.0">
<script defer src="app.js?v=3.4.0"></script>
<script defer src="player.js?v=3.4.0"></script>
<script defer src="intercom.js?v=3.4.0"></script>
<script defer src="timers.js?v=3.4.0"></script>
</head>
<body class="s-calm">
<noscript><div class="noscript">Javascript is not supported on this browser</div></noscript>

<!-- The clock screen: today's events, the clock, then countdowns + music. -->
<main id="screen">
  <div id="top"></div>

  <div id="clockArea">
    <div id="clockBlock">
      <div id="time"><span id="hh">--</span>:<span id="mm">--</span>:<span id="ss">--</span></div>
      <div id="date"></div>
    </div>
  </div>

  <div id="bottom">
    <!-- Kitchen timers, bottom-left: "Timer" when idle; while running, the next one in big
         digits and a second card with the two after it. -->
    <div id="timerDock">
      <button id="timerBtn" type="button" aria-label="Kitchen timers">
        <span class="tb-head"><span class="tb-icon" data-icon="timer"></span><span id="timerBtnLabel" class="tb-label">Timer</span></span>
        <span id="timerBtnText" class="tb-time" hidden></span>
      </button>
      <button id="timerNext" type="button" aria-label="More timers" hidden></button>
    </div>
    <div id="bars"></div>
    <div id="dock">
    <div id="mini">
      <button id="miniOpen" type="button" aria-label="Open music player">
        <span class="mini-art"><img id="miniArt" alt="" hidden><span id="miniPh" class="art-ph" data-icon="note"></span></span>
        <span class="mini-meta"><span id="miniTitle" class="mini-title">Music</span><span id="miniSub" class="mini-sub"></span></span>
      </button>
      <button id="miniPlay" class="ibtn" type="button" aria-label="Play" data-icon="play"></button>
      <button id="miniNext" class="ibtn" type="button" aria-label="Next song" data-icon="next"></button>
      <span class="mini-progress" aria-hidden="true"><i id="miniBar"></i></span>
    </div>
    <!-- Intercom: hold to record, let go to play it through the panel at full volume. -->
    <button id="miniTalk" class="ibtn" type="button" aria-label="Hold to talk" data-icon="mic"></button>
    </div>
  </div>
</main>

<div id="status" hidden><span id="statusIcon" hidden></span><span id="statusText"></span></div>
<button id="fsBtn" class="ibtn" type="button" aria-label="Full screen" data-icon="fullscreen"></button>

<!-- Full player: slides up when the mini player is tapped. -->
<section id="fp" aria-label="Music player" aria-hidden="true">
  <div class="fp-tint"></div>
  <header class="fp-head">
    <button id="fpClose" class="ibtn" type="button" aria-label="Close music player" data-icon="down"></button>
    <div class="fp-headline"><span id="fpSwatch" class="fp-swatch" hidden></span><span id="fpHeadline"></span></div>
    <div id="fpTime" class="fp-time"></div>
  </header>
  <div class="fp-body">
    <div class="fp-main">
      <div id="fpArtBox" class="fp-art-box">
        <img id="fpArt" class="fp-art" alt="" hidden>
        <div id="fpArtPh" class="fp-art-ph" data-icon="note"></div>
      </div>
      <div class="fp-meta">
        <div id="fpTitle" class="fp-title"></div>
        <div id="fpSub" class="fp-sub"></div>
      </div>
      <div class="fp-seek">
        <input id="fpSeek" class="range" type="range" min="0" max="1000" step="1" value="0" aria-label="Song position">
        <div class="fp-times"><span id="fpCur">0:00</span><span id="fpDur">0:00</span></div>
      </div>
      <div class="fp-controls">
        <button id="fpShuffle" class="ibtn" type="button" aria-label="Shuffle" aria-pressed="false" data-icon="shuffle"></button>
        <button id="fpPrev" class="ibtn" type="button" aria-label="Previous song" data-icon="prev"></button>
        <button id="fpPlay" class="ibtn fp-play" type="button" aria-label="Play" data-icon="play"></button>
        <button id="fpNext" class="ibtn" type="button" aria-label="Next song" data-icon="next"></button>
        <button id="fpRepeat" class="ibtn" type="button" aria-label="Repeating all songs" data-icon="repeat"></button>
      </div>
      <div class="fp-vol">
        <span class="fp-vol-icon" data-icon="volDown"></span>
        <input id="fpVol" class="range" type="range" min="0" max="100" step="1" value="100" aria-label="Volume">
        <span class="fp-vol-icon" data-icon="volUp"></span>
      </div>
    </div>
    <div class="fp-side">
      <div class="fp-tabs" role="tablist">
        <button id="tabQueue" class="fp-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="paneQueue">Up next</button>
        <button id="tabSearch" class="fp-tab" type="button" role="tab" aria-selected="false" aria-controls="paneSearch">Search</button>
        <span id="fpSaved"></span>
      </div>
      <div id="paneQueue" class="fp-pane" role="tabpanel" aria-labelledby="tabQueue">
        <div id="fpQueue" class="fp-queue"></div>
      </div>
      <div id="paneSearch" class="fp-pane" role="tabpanel" aria-labelledby="tabSearch" hidden>
        <form id="searchForm" class="search-bar" role="search" autocomplete="off">
          <span class="search-icon" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Search YouTube Music" enterkeyhint="search" aria-label="Search YouTube Music">
        </form>
        <div class="search-kinds" role="group" aria-label="Show">
          <button class="chip is-active" type="button" data-kind="songs" aria-pressed="true">Songs</button>
          <button class="chip" type="button" data-kind="videos" aria-pressed="false">Videos</button>
        </div>
        <div id="searchNote" class="search-note"></div>
        <div id="searchResults" class="fp-queue"></div>
      </div>
    </div>
  </div>
</section>

<!-- Kitchen timers: slides up when the timer button is tapped. -->
<section id="tm" aria-label="Kitchen timers" aria-hidden="true">
  <header class="tm-head">
    <button id="tmClose" class="ibtn" type="button" aria-label="Close timers" data-icon="down"></button>
    <h2>Kitchen timers</h2>
  </header>
  <div class="tm-body">
    <div class="tm-new">
      <button id="tmMinus" class="tm-step" type="button" aria-label="One minute less">−1</button>
      <div id="tmNewTime" class="tm-new-time">20 min</div>
      <button id="tmPlus" class="tm-step" type="button" aria-label="One minute more">+1</button>
      <button id="tmStart" class="tm-start" type="button"><span data-icon="play"></span>Start</button>
    </div>
    <div id="tmList" class="tm-list is-empty"></div>
  </div>
</section>

<div id="tmAlert" role="alertdialog" aria-labelledby="tmAlertTitle" hidden>
  <div class="tma-icon" data-icon="timer"></div>
  <div id="tmAlertTitle" class="tma-title">Timer done</div>
  <div id="tmAlertSub" class="tma-sub"></div>
  <div class="tma-buttons">
    <button id="tmAlertMore" type="button">+1 min</button>
    <button id="tmAlertStop" type="button">Stop</button>
  </div>
</div>

<div id="diag" role="dialog" aria-label="Diagnostics" hidden>
  <div class="diag-head">
    <h2>Diagnostics</h2>
    <button id="diagClear" type="button">Clear activity</button>
    <button id="diagClose" type="button">Close</button>
  </div>
  <pre id="diagText"></pre>
</div>

<audio id="audio" preload="none"></audio>
</body>
</html>
