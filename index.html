<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3.21">
</head>
<body>
    <noscript>
        <div class="noscript-fallback">Javascript is not supported on this browser</div>
    </noscript>

    <div class="container" id="container">
        <div class="content-wrapper" id="contentWrapper">
            <div class="event-section" id="eventSection"></div>

            <div class="clock-container" id="clockContainer">
                <div class="time-display" id="timeDisplay">--:--:--</div>
                <div class="date-display" id="dateDisplay" style="cursor: pointer;">Loading Date...</div>
            </div>

            <div class="progress-container" id="progressContainer"></div>
        </div>
    </div>

    <div id="secretMusicModulePlaceholder"></div>
    <script src="script.js?v=3.21"></script>
</body>
</html>
