<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Jellyclock: a 90s twin-bell alarm clock. Source for icon-192.png and icon-512.png
       (rendered at those sizes); the Android launcher has the same drawing as a vector,
       android/res/drawable/ic_alarm_clock.xml. Drawn inside the middle 72% so it survives
       Android's round / squircle icon masks. -->
